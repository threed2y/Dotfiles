[config.wallpaper]
command = "pkill swaybg; setsid swaybg -i '{{image}}' -m fill &"
set = true

[templates.waybar]
input_path = './templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.mako]
input_path = './templates/colors-mako'
output_path = '~/.config/mako/config'
post_hook = 'makoctl reload'

[templates.fuzzel]
input_path = './templates/colors-fuzzel.ini'
output_path = '~/.config/fuzzel/colors-fuzzel.ini'

[templates.swaylock]
input_path = './templates/colors-swaylock.conf'
output_path = '~/.config/swaylock/config'

[templates.alacritty]
input_path = './templates/alacritty-colors.toml'
output_path = '~/.config/alacritty/colors.toml'
[templates.niri]
input_path = './templates/niri-colors.kdl'
output_path = '~/.config/niri/niri-colors.kdl'
 

