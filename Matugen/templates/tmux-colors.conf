# Generated by matugen — do not edit by hand

# Status bar
set -g status-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface_variant.default.hex}}"
set -g status-left-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g status-right-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface_variant.default.hex}}"

# Windows
set -g window-status-style "bg={{colors.surface_container.default.hex}},fg={{colors.outline.default.hex}}"
set -g window-status-current-style "bg={{colors.primary_container.default.hex}},fg={{colors.on_primary_container.default.hex}},bold"
set -g window-status-activity-style "bg={{colors.surface_container.default.hex}},fg={{colors.tertiary.default.hex}}"
set -g window-status-bell-style "bg={{colors.error_container.default.hex}},fg={{colors.on_error_container.default.hex}}"
set -g window-status-separator ""

# Panes
set -g pane-border-style "fg={{colors.outline_variant.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"
set -g display-panes-colour "{{colors.outline.default.hex}}"
set -g display-panes-active-colour "{{colors.primary.default.hex}}"

# Messages / command prompt
set -g message-style "bg={{colors.secondary_container.default.hex}},fg={{colors.on_secondary_container.default.hex}}"
set -g message-command-style "bg={{colors.tertiary_container.default.hex}},fg={{colors.on_tertiary_container.default.hex}}"

# Copy mode / choose-tree
set -g mode-style "bg={{colors.primary_container.default.hex}},fg={{colors.on_primary_container.default.hex}}"

# Clock
set -g clock-mode-colour "{{colors.primary.default.hex}}"

# Status contents (colors pulled from the same palette)
set -g status-left "#[bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold]  #S #[bg={{colors.surface_container.default.hex}},fg={{colors.primary.default.hex}}] "
set -g status-right "#[fg={{colors.outline.default.hex}}]%a %d %b #[bg={{colors.secondary_container.default.hex}},fg={{colors.on_secondary_container.default.hex}},bold] %H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
