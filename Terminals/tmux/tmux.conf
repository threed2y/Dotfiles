# ~/.config/tmux/tmux.conf

# True color inside Alacritty
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB"
set -as terminal-overrides ",alacritty*:Tc"

# Native copy/paste: tmux leaves the mouse to Alacritty
# (drag to select, Ctrl+Shift+C / Ctrl+Shift+V)
set -g mouse off

# Keyboard copy mode (prefix + [): vi keys, yank to the Wayland clipboard
set -g mode-keys vi
set -s set-clipboard on
set -s copy-command 'wl-copy'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'

# Colors generated by Matugen (ignored until the first `matugen image` run)
source-file -q ~/.config/tmux/colors.conf
